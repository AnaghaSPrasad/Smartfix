name: smartfix_app
description: SmartFix - Home Services Booking App (Flutter frontend for Django REST backend)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.1

  # Local storage (for auth token persistence)
  shared_preferences: ^2.2.3

  # UI helpers
  intl: ^0.19.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
